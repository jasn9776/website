<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480">
  <defs>
    <radialGradient id="mgm-g1" cx="20%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#1E47E6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="mgm-g2" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#A8BDF5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <pattern id="mgm-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(233,238,246,0.1)" stroke-width="1"/>
    </pattern>
    <filter id="mgm-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="#0B1730"/>
  <rect width="1200" height="480" fill="url(#mgm-grid)"/>
  <rect width="1200" height="480" fill="url(#mgm-g1)"/>
  <rect width="1200" height="480" fill="url(#mgm-g2)"/>

  <!-- connecting lines: genes (left) matched to cell types (right) -->
  <g stroke-width="2" fill="none" filter="url(#mgm-glow)">
    <path d="M 330 118 C 520 118, 520 118, 700 118" stroke="#A8BDF5" stroke-opacity="0.85"/>
    <path d="M 330 210 C 520 210, 520 300, 700 300" stroke="#A8BDF5" stroke-opacity="0.5"/>
    <path d="M 330 302 C 520 302, 520 210, 700 210" stroke="#A8BDF5" stroke-opacity="0.5"/>
    <path d="M 330 394 C 520 394, 520 394, 700 394" stroke="#A8BDF5" stroke-opacity="0.85"/>
  </g>

  <!-- gene tags (left column) -->
  <g font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600">
    <g>
      <rect x="150" y="98" width="180" height="40" rx="10" fill="#0B1730" stroke="#1E47E6" stroke-width="2"/>
      <text x="240" y="124" fill="#E9EEF6" text-anchor="middle">CD3E</text>
    </g>
    <g>
      <rect x="150" y="190" width="180" height="40" rx="10" fill="#0B1730" stroke="#1E47E6" stroke-width="2"/>
      <text x="240" y="216" fill="#E9EEF6" text-anchor="middle">GZMB</text>
    </g>
    <g>
      <rect x="150" y="282" width="180" height="40" rx="10" fill="#0B1730" stroke="#1E47E6" stroke-width="2"/>
      <text x="240" y="308" fill="#E9EEF6" text-anchor="middle">CD79A</text>
    </g>
    <g>
      <rect x="150" y="374" width="180" height="40" rx="10" fill="#0B1730" stroke="#1E47E6" stroke-width="2"/>
      <text x="240" y="400" fill="#E9EEF6" text-anchor="middle">LYZ</text>
    </g>
  </g>

  <!-- cell type nodes (right column) -->
  <g font-family="Geist, sans-serif" font-size="19" font-weight="600">
    <g>
      <circle cx="760" cy="118" r="30" fill="#1E47E6"/>
      <circle cx="760" cy="118" r="9" fill="#A8BDF5"/>
      <text x="800" y="124" fill="#E9EEF6">T cell</text>
    </g>
    <g>
      <circle cx="760" cy="210" r="30" fill="#1E47E6" fill-opacity="0.75"/>
      <circle cx="760" cy="210" r="9" fill="#A8BDF5"/>
      <text x="800" y="216" fill="#E9EEF6">NK cell</text>
    </g>
    <g>
      <circle cx="760" cy="302" r="30" fill="#1E47E6" fill-opacity="0.75"/>
      <circle cx="760" cy="302" r="9" fill="#A8BDF5"/>
      <text x="800" y="308" fill="#E9EEF6">B cell</text>
    </g>
    <g>
      <circle cx="760" cy="394" r="30" fill="#1E47E6"/>
      <circle cx="760" cy="394" r="9" fill="#A8BDF5"/>
      <text x="800" y="400" fill="#E9EEF6">Monocyte</text>
    </g>
  </g>

  <!-- faint background cell dots for texture -->
  <g fill="#A8BDF5" fill-opacity="0.12">
    <circle cx="1080" cy="80" r="14"/>
    <circle cx="1130" cy="150" r="10"/>
    <circle cx="1050" cy="220" r="18"/>
    <circle cx="1120" cy="330" r="12"/>
    <circle cx="1070" cy="410" r="16"/>
    <circle cx="60" cy="60" r="10"/>
    <circle cx="90" cy="430" r="14"/>
  </g>
</svg>
