<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480">
  <defs>
    <radialGradient id="glowL" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#1E47E6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glowR" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#A8BDF5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(233,238,246,0.08)" stroke-width="1"/>
    </pattern>
    <!-- classic crab invader, 11x8 pixel grid at unit scale -->
    <path id="invader" d="M2 0h1v1h-1z M8 0h1v1h-1z M3 1h1v1h-1z M7 1h1v1h-1z M2 2h7v1h-7z M1 3h2v1h-2z M4 3h3v1h-3z M8 3h2v1h-2z M0 4h11v1h-11z M0 5h1v1h-1z M2 5h7v1h-7z M10 5h1v1h-1z M0 6h1v1h-1z M2 6h1v1h-1z M8 6h1v1h-1z M10 6h1v1h-1z M3 7h2v1h-2z M6 7h2v1h-2z"/>
    <!-- player cannon, 11x5 pixel grid at unit scale -->
    <path id="ship" d="M5 0h1v1h-1z M4 1h3v1h-3z M1 2h9v1h-9z M0 3h11v2h-11z"/>
  </defs>

  <rect width="1200" height="480" fill="#0B1730"/>
  <rect width="1200" height="480" fill="url(#grid)"/>
  <rect width="1200" height="480" fill="url(#glowL)"/>
  <rect width="1200" height="480" fill="url(#glowR)"/>

  <!-- stars -->
  <g fill="#E9EEF6">
    <rect x="80"   y="60"  width="3" height="3" opacity="0.5"/>
    <rect x="300"  y="110" width="3" height="3" opacity="0.3"/>
    <rect x="520"  y="45"  width="3" height="3" opacity="0.45"/>
    <rect x="760"  y="90"  width="3" height="3" opacity="0.3"/>
    <rect x="980"  y="55"  width="3" height="3" opacity="0.5"/>
    <rect x="1120" y="140" width="3" height="3" opacity="0.35"/>
    <rect x="160"  y="230" width="3" height="3" opacity="0.25"/>
    <rect x="1050" y="300" width="3" height="3" opacity="0.3"/>
    <rect x="70"   y="380" width="3" height="3" opacity="0.35"/>
    <rect x="640"  y="200" width="3" height="3" opacity="0.25"/>
  </g>

  <!-- HUD -->
  <g font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="4">
    <text x="48" y="52" fill="#A8BDF5">SCORE 0800</text>
    <text x="1152" y="52" fill="#A8BDF5" text-anchor="end">WAVE 3/8</text>
  </g>

  <!-- question card -->
  <g>
    <rect x="420" y="34" width="360" height="52" rx="10" fill="#DDE5F0"/>
    <rect x="420" y="34" width="360" height="52" rx="10" fill="none" stroke="#1E47E6" stroke-width="2"/>
    <text x="600" y="67" font-family="'JetBrains Mono', monospace" font-size="20" fill="#0B1730" text-anchor="middle" letter-spacing="2">CAPITAL OF FRANCE?</text>
  </g>

  <!-- invader fleet -->
  <g fill="#A8BDF5">
    <use href="#invader" transform="translate(150,130) scale(6)" opacity="0.5"/>
    <use href="#invader" transform="translate(370,130) scale(6)" opacity="0.7"/>
    <use href="#invader" transform="translate(590,130) scale(6)" opacity="0.9"/>
    <use href="#invader" transform="translate(810,130) scale(6)" opacity="0.7"/>
    <use href="#invader" transform="translate(1030,130) scale(6)" opacity="0.5"/>
    <use href="#invader" transform="translate(260,215) scale(6)" opacity="0.35"/>
    <use href="#invader" transform="translate(920,215) scale(6)" opacity="0.35"/>
  </g>
  <use href="#invader" transform="translate(480,215) scale(6)" fill="#1E47E6"/>

  <!-- exploding invader: particle burst where one was hit -->
  <g fill="#1E47E6">
    <rect x="726" y="230" width="8" height="8"/>
    <rect x="758" y="212" width="8" height="8" opacity="0.85"/>
    <rect x="790" y="238" width="8" height="8" opacity="0.7"/>
    <rect x="744" y="262" width="8" height="8" opacity="0.7"/>
    <rect x="778" y="270" width="8" height="8" opacity="0.5"/>
    <rect x="712" y="258" width="6" height="6" opacity="0.5"/>
    <rect x="800" y="200" width="6" height="6" opacity="0.4"/>
  </g>
  <g fill="#A8BDF5">
    <rect x="748" y="234" width="10" height="10"/>
    <rect x="770" y="246" width="8" height="8" opacity="0.7"/>
  </g>

  <!-- falling answer cards -->
  <g font-family="'JetBrains Mono', monospace" font-size="18" letter-spacing="3" text-anchor="middle">
    <g opacity="0.85">
      <rect x="200" y="300" width="150" height="44" rx="8" fill="#2C3E5E"/>
      <text x="275" y="328" fill="#E9EEF6">LONDON</text>
    </g>
    <g>
      <rect x="525" y="320" width="150" height="44" rx="8" fill="#1E47E6"/>
      <text x="600" y="348" fill="#E9EEF6">PARIS</text>
    </g>
    <g opacity="0.85">
      <rect x="860" y="290" width="150" height="44" rx="8" fill="#2C3E5E"/>
      <text x="935" y="318" fill="#E9EEF6">MADRID</text>
    </g>
  </g>

  <!-- bullet streaking toward the correct card -->
  <rect x="597" y="382" width="6" height="18" fill="#E9EEF6"/>
  <rect x="597" y="408" width="6" height="10" fill="#E9EEF6" opacity="0.4"/>

  <!-- player ship -->
  <use href="#ship" transform="translate(567,420) scale(6)" fill="#E9EEF6"/>

  <!-- ground line -->
  <rect x="48" y="462" width="1104" height="3" fill="#A8BDF5" opacity="0.35"/>
</svg>
