<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="g1" cx="22%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1E47E6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="g2" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#A8BDF5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <pattern id="pgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(233,238,246,0.08)" stroke-width="1"/>
    </pattern>
    <!-- one feature map: a square slab seen at an angle -->
    <g id="map">
      <path d="M0 0 L26 -14 L26 46 L0 60 Z" fill="#1E47E6" fill-opacity="0.55" stroke="#A8BDF5" stroke-width="1"/>
    </g>
    <g id="mapS">
      <path d="M0 0 L18 -10 L18 26 L0 36 Z" fill="#1E47E6" fill-opacity="0.6" stroke="#A8BDF5" stroke-width="1"/>
    </g>
  </defs>

  <rect width="400" height="300" fill="#0B1730"/>
  <rect width="400" height="300" fill="url(#pgrid)"/>
  <rect width="400" height="300" fill="url(#g1)"/>
  <rect width="400" height="300" fill="url(#g2)"/>

  <!-- input digit -->
  <g transform="translate(34 104)">
    <path d="M0 0 L40 -22 L40 70 L0 92 Z" fill="#E9EEF6" fill-opacity="0.08" stroke="#E9EEF6" stroke-opacity="0.7" stroke-width="1.2"/>
    <path d="M12 20 Q30 6 28 26 Q26 44 14 62 L30 54" fill="none" stroke="#E9EEF6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- conv stage 1: a stack of maps -->
  <g transform="translate(104 106)">
    <use href="#map"/><use href="#map" x="8"/><use href="#map" x="16"/><use href="#map" x="24"/><use href="#map" x="32"/>
  </g>
  <!-- conv stage 2: smaller, deeper -->
  <g transform="translate(186 118)">
    <use href="#mapS"/><use href="#mapS" x="6"/><use href="#mapS" x="12"/><use href="#mapS" x="18"/><use href="#mapS" x="24"/><use href="#mapS" x="30"/><use href="#mapS" x="36"/>
  </g>

  <!-- dense layer and outputs -->
  <g fill="#A8BDF5">
    <rect x="262" y="96"  width="10" height="10" rx="2" opacity="0.5"/>
    <rect x="262" y="112" width="10" height="10" rx="2" opacity="0.9"/>
    <rect x="262" y="128" width="10" height="10" rx="2" opacity="0.35"/>
    <rect x="262" y="144" width="10" height="10" rx="2" opacity="0.75"/>
    <rect x="262" y="160" width="10" height="10" rx="2" opacity="0.45"/>
    <rect x="262" y="176" width="10" height="10" rx="2" opacity="0.6"/>
  </g>
  <g stroke="#A8BDF5" stroke-opacity="0.25" stroke-width="1">
    <path d="M272 101 L324 118 M272 117 L324 118 M272 133 L324 118 M272 149 L324 118 M272 165 L324 118 M272 181 L324 118"/>
    <path d="M272 101 L324 134 M272 117 L324 134 M272 133 L324 134 M272 149 L324 134 M272 165 L324 134 M272 181 L324 134"/>
  </g>
  <g>
    <circle cx="328" cy="102" r="5" fill="#E9EEF6" fill-opacity="0.25"/>
    <circle cx="328" cy="118" r="5" fill="#E9EEF6" fill-opacity="0.25"/>
    <circle cx="328" cy="134" r="7" fill="#1E47E6" stroke="#E9EEF6" stroke-width="1.5"/>
    <circle cx="328" cy="150" r="5" fill="#E9EEF6" fill-opacity="0.25"/>
    <circle cx="328" cy="166" r="5" fill="#E9EEF6" fill-opacity="0.25"/>
    <circle cx="328" cy="182" r="5" fill="#E9EEF6" fill-opacity="0.25"/>
  </g>

  <!-- flow arrows -->
  <g stroke="#E9EEF6" stroke-opacity="0.5" stroke-width="1.2" fill="none">
    <path d="M86 150 L98 150 M95 146 L99 150 L95 154"/>
    <path d="M168 150 L180 150 M177 146 L181 150 L177 154"/>
    <path d="M238 150 L252 150 M249 146 L253 150 L249 154"/>
  </g>

  <!-- code hint -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#A8BDF5" fill-opacity="0.75">
    <text x="34" y="250">Conv2d → MaxPool2d → Linear → softmax</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#E9EEF6" fill-opacity="0.45">
    <text x="34" y="44">1×28×28</text><text x="112" y="44">16×28×28</text><text x="190" y="44">32×14×14</text><text x="300" y="44">10</text>
  </g>
</svg>
