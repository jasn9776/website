<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="g1" cx="25%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#1E47E6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="g2" cx="80%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#A8BDF5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <pattern id="pgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(233,238,246,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="#0B1730"/>
  <rect width="400" height="300" fill="url(#pgrid)"/>
  <rect width="400" height="300" fill="url(#g1)"/>
  <rect width="400" height="300" fill="url(#g2)"/>

  <!-- price history line -->
  <polyline points="30,210 75,185 120,195 165,150 210,165 255,120 300,135 345,90 372,100"
    fill="none" stroke="#1E47E6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="30,230 75,225 120,205 165,215 210,190 255,200 300,175 345,180 372,160"
    fill="none" stroke="#A8BDF5" stroke-width="2" stroke-dasharray="6 5" opacity="0.7"/>
  <g fill="#E9EEF6">
    <circle cx="165" cy="150" r="4"/>
    <circle cx="255" cy="120" r="4"/>
    <circle cx="345" cy="90" r="4"/>
  </g>

  <!-- village skyline: houses along the baseline -->
  <g fill="#A8BDF5" opacity="0.85">
    <path d="M40 262 l14 -13 14 13 v18 h-28 z"/>
    <path d="M92 262 l14 -13 14 13 v18 h-28 z"/>
    <path d="M144 258 l16 -15 16 15 v22 h-32 z" fill="#1E47E6"/>
    <path d="M202 262 l14 -13 14 13 v18 h-28 z"/>
    <path d="M254 262 l14 -13 14 13 v18 h-28 z"/>
  </g>
  <!-- tree (the commons) -->
  <g>
    <rect x="322" y="258" width="6" height="22" fill="#A8BDF5" opacity="0.6"/>
    <circle cx="325" cy="248" r="16" fill="#1E47E6" opacity="0.8"/>
  </g>

  <!-- villagers -->
  <g fill="#E9EEF6">
    <circle cx="78" cy="252" r="4" opacity="0.9"/>
    <circle cx="188" cy="254" r="4" opacity="0.7"/>
    <circle cx="296" cy="252" r="4" opacity="0.8"/>
  </g>

  <!-- coin -->
  <g>
    <circle cx="70" cy="80" r="26" fill="none" stroke="#A8BDF5" stroke-width="3" opacity="0.9"/>
    <text x="70" y="90" font-family="'JetBrains Mono', monospace" font-size="28" fill="#E9EEF6" text-anchor="middle">$</text>
  </g>

  <!-- supply / demand label -->
  <text x="372" y="46" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="3" fill="#E9EEF6" text-anchor="end" opacity="0.7">SUPPLY / DEMAND</text>

  <!-- ground line -->
  <rect x="24" y="280" width="352" height="2" fill="#A8BDF5" opacity="0.35"/>
</svg>
