<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bspGlowL" cx="20%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#1E47E6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="bspGlowR" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#A8BDF5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <pattern id="bspGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(233,238,246,0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="#0B1730"/>
  <rect width="400" height="300" fill="url(#bspGrid)"/>
  <rect width="400" height="300" fill="url(#bspGlowL)"/>
  <rect width="400" height="300" fill="url(#bspGlowR)"/>

  <!-- road -->
  <rect x="0" y="80" width="400" height="140" fill="#101E3C"/>
  <rect x="0" y="80" width="400" height="2" fill="#A8BDF5" opacity="0.35"/>
  <rect x="0" y="218" width="400" height="2" fill="#A8BDF5" opacity="0.35"/>
  <g fill="#E9EEF6" opacity="0.3">
    <rect x="10"  y="147" width="28" height="4"/>
    <rect x="76"  y="147" width="28" height="4"/>
    <rect x="142" y="147" width="28" height="4"/>
    <rect x="208" y="147" width="28" height="4"/>
    <rect x="274" y="147" width="28" height="4"/>
    <rect x="340" y="147" width="28" height="4"/>
  </g>

  <!-- forward field of view (car faces right) -->
  <path d="M 190 150 L 400 40 L 400 260 Z" fill="#1E47E6" opacity="0.12"/>
  <path d="M 190 150 L 400 40"  stroke="#A8BDF5" stroke-width="1" opacity="0.35" stroke-dasharray="4 4"/>
  <path d="M 190 150 L 400 260" stroke="#A8BDF5" stroke-width="1" opacity="0.35" stroke-dasharray="4 4"/>

  <!-- mirror coverage cones (rearward) -->
  <path d="M 172 126 L 20 100 L 70 60 Z"   fill="#46A758" opacity="0.16"/>
  <path d="M 172 174 L 20 200 L 70 240 Z"  fill="#46A758" opacity="0.16"/>

  <!-- blind spot wedges -->
  <path d="M 176 130 L 76 56 L 156 34 L 188 132 Z"   fill="#E5484D" opacity="0.22"/>
  <path d="M 176 170 L 76 244 L 156 266 L 188 168 Z" fill="#E5484D" opacity="0.28"/>

  <!-- car (top-down, facing right) -->
  <g>
    <rect x="160" y="130" width="66" height="40" rx="9" fill="#DDE5F0"/>
    <rect x="180" y="134" width="18" height="32" rx="5" fill="#2C3E5E"/>
    <rect x="203" y="136" width="14" height="28" rx="4" fill="#6B7A94"/>
    <rect x="173" y="124" width="9" height="7" rx="2" fill="#DDE5F0"/>
    <rect x="173" y="169" width="9" height="7" rx="2" fill="#DDE5F0"/>
    <rect x="221" y="135" width="5" height="7" rx="2" fill="#A8BDF5"/>
    <rect x="221" y="158" width="5" height="7" rx="2" fill="#A8BDF5"/>
  </g>

  <!-- motorcycle hidden in the lower blind wedge -->
  <g>
    <circle cx="112" cy="228" r="22" fill="none" stroke="#E5484D" stroke-width="1.5" stroke-dasharray="5 4"/>
    <g fill="#E9EEF6">
      <rect x="100" y="224" width="24" height="7" rx="3"/>
      <circle cx="103" cy="234" r="4.5" fill="none" stroke="#E9EEF6" stroke-width="3"/>
      <circle cx="122" cy="234" r="4.5" fill="none" stroke="#E9EEF6" stroke-width="3"/>
      <rect x="109" y="217" width="7" height="7" rx="3"/>
    </g>
    <text x="112" y="272" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2" fill="#E5484D" text-anchor="middle">HIDDEN</text>
  </g>
</svg>
