<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blind Spot Driving Sim</title>
<style>
  :root{
    --panel:#17191cf2; --ink:#f2f0ea; --muted:#9aa0a8;
    --amber:#ffb000; --red:#e5484d; --green:#46a758; --line:#2c2f34;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0e0f11;
    font-family:"Helvetica Neue",Arial,system-ui,sans-serif;color:var(--ink)}
  canvas{display:block;touch-action:none}
  .hud{position:fixed;z-index:10;user-select:none;-webkit-user-select:none}

  #panel{top:12px;left:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;width:224px;backdrop-filter:blur(6px)}
  #panel h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
    color:var(--amber);margin-bottom:8px}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:9px}
  .seg button{flex:1;background:transparent;border:0;color:var(--muted);padding:7px 4px;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer}
  .seg button.on{background:var(--amber);color:#151310}
  label.chk{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0;cursor:pointer}
  label.chk input{accent-color:var(--amber)}
  #hint{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.5;
    border-top:1px solid var(--line);padding-top:7px}

  #banner{top:12px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
  #banner .sign{display:inline-block;padding:8px 16px;border-radius:8px;font-weight:800;
    font-size:13px;letter-spacing:.11em;text-transform:uppercase;border:2px solid transparent}
  #banner .sign.ok{background:#10240ecc;color:#8fe08a;border-color:var(--green)}
  #banner .sign.bad{background:#2b0d0ecc;color:#ff9b9e;border-color:var(--red)}
  #banner .why{margin-top:5px;font-size:11px;color:#d7d3c9;background:#17191cb8;
    display:inline-block;padding:4px 10px;border-radius:6px}

  #bar{bottom:132px;left:50%;transform:translateX(-50%);background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;
    align-items:center;gap:10px;backdrop-filter:blur(6px);max-width:94vw}
  #bar .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  #bar input[type=range]{width:min(240px,32vw);accent-color:var(--amber)}
  #bar button{background:transparent;border:1px solid var(--line);color:var(--ink);
    border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;cursor:pointer;white-space:nowrap}
  #bar button.on{background:var(--amber);color:#151310;border-color:var(--amber)}

  #speedo{bottom:14px;left:50%;transform:translateX(-50%);background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:8px 16px;text-align:center;
    font-variant-numeric:tabular-nums}
  #speedo b{font-size:20px;letter-spacing:.03em}
  #speedo span{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}

  .pad{display:flex;gap:10px;align-items:flex-end}
  #steerPad{bottom:14px;left:14px}
  #pedalPad{bottom:14px;right:14px}
  .padbtn{width:74px;height:74px;border-radius:12px;background:var(--panel);
    border:1px solid var(--line);color:var(--ink);font-size:22px;font-weight:800;cursor:pointer;
    touch-action:none;display:flex;align-items:center;justify-content:center;
    letter-spacing:.06em}
  .padbtn.tall{height:96px;font-size:12px;text-transform:uppercase;flex-direction:column;gap:4px}
  .padbtn.tall small{font-size:20px}
  .padbtn:active,.padbtn.held{background:var(--amber);color:#151310;border-color:var(--amber)}
  #btnGear{width:74px;height:44px;border-radius:10px;font-size:15px}
  #btnGear.rev{background:var(--red);border-color:var(--red);color:#fff}
  .pcol{display:flex;flex-direction:column;gap:8px;align-items:center}

  @media (max-width:700px){
    #panel{width:168px;padding:9px}
    #hint{display:none}
    #bar{bottom:150px;flex-wrap:wrap;justify-content:center}
    .padbtn{width:62px;height:62px}
    .padbtn.tall{height:84px}
  }
</style>
</head>
<body>

<div id="panel" class="hud">
  <h1>Blind Spot Driving Sim</h1>
  <div class="seg">
    <button id="btnPov" class="on">Driver view</button>
    <button id="btnOrbit">Overhead</button>
  </div>
  <label class="chk"><input type="checkbox" id="chkBike" checked> Motorcycle demo</label>
  <label class="chk"><input type="checkbox" id="chkBlind" checked> Blind spot zones</label>
  <label class="chk"><input type="checkbox" id="chkCover"> Mirror coverage</label>
  <div id="hint">Drive: W A S D or arrows, G = gear. Drag to turn your head, double&#8209;click to recentre.
  Watch for pedestrians on the zebra crossings, and try parking in the two amber bays (one 90&deg;, one parallel).</div>
</div>

<div id="banner" class="hud" style="display:none">
  <div class="sign ok" id="signBox"></div><br>
  <div class="why" id="whyBox"></div>
</div>

<div id="bar" class="hud">
  <span class="lbl">Motorcycle</span>
  <input type="range" id="bikeSlider" min="-14" max="22" step="0.1" value="2.4">
  <button id="btnRide">&#9658; Ride past</button>
  <button id="btnLane">Lane: right</button>
</div>

<div id="speedo" class="hud"><b id="spdVal">0</b> <span>km/h</span> &nbsp;<span id="gearVal" style="color:var(--amber);font-weight:800">D</span></div>

<div id="steerPad" class="hud pad">
  <div class="padbtn" id="btnL">&#9664;</div>
  <div class="padbtn" id="btnR">&#9654;</div>
</div>

<div id="pedalPad" class="hud pad">
  <div class="pcol">
    <div class="padbtn" id="btnGear">D</div>
    <div class="padbtn tall" id="btnBrake">Brake<small>&#9632;</small></div>
  </div>
  <div class="padbtn tall" id="btnGas">Gas<small>&#9650;</small></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

// ---------- constants ----------
const LANE_W = 3.5;
const WHEELBASE = 2.9;
const EYE = new THREE.Vector3(0.42, 1.18, -0.10);      // right-hand drive
const PERIPHERAL_DEG = 95;
const MIRRORS = {
  right: { pos:new THREE.Vector3( 1.02, 1.05, -0.85), dir:new THREE.Vector3( 0.18,-0.02,1), fov:17, aspect:27/15, size:[0.27,0.15] },
  left : { pos:new THREE.Vector3(-1.02, 1.05, -0.85), dir:new THREE.Vector3(-0.18,-0.02,1), fov:17, aspect:27/15, size:[0.27,0.15] },
  rear : { pos:new THREE.Vector3( 0.15, 1.30, -0.58), dir:new THREE.Vector3( 0.00,-0.02,1), fov:20, aspect:56/15, size:[0.56,0.15] }
};

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9c3d6);
scene.fog = new THREE.Fog(0xa9c3d6, 55, 190);

scene.add(new THREE.HemisphereLight(0xcfe4f2, 0x54604a, 0.85));
const sun = new THREE.DirectionalLight(0xfff2dd, 0.9);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
sun.shadow.camera.top = 26;  sun.shadow.camera.bottom = -26;
sun.shadow.camera.far = 140;
scene.add(sun); scene.add(sun.target);

// ---------- helpers ----------
function mat(c, o){ return new THREE.MeshLambertMaterial(Object.assign({ color:c }, o||{})); }
function box(g, w, h, d, m, x, y, z, rx, ry, rz){
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  b.position.set(x, y, z);
  if (rx) b.rotation.x = rx; if (ry) b.rotation.y = ry; if (rz) b.rotation.z = rz;
  b.castShadow = true; b.receiveShadow = true;
  g.add(b); return b;
}
function flat(parent, w, d, m, x, z, y){
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, d), m);
  p.rotation.x = -Math.PI/2; p.position.set(x, y, z); p.receiveShadow = true;
  parent.add(p); return p;
}

// ---------- world ----------
const asphalt = mat(0x2e3134), asphalt2 = mat(0x35383c), lineMat = mat(0xd8d6cd);
flat(scene, 400, 400, mat(0x76865f), 0, 0, -0.02);                        // grass
flat(scene, LANE_W*3 + 0.8, 300, asphalt, 0, 0, 0);                       // main road (N-S)
for (const z of [-40, 40]) {                                              // cross streets (E-W)
  flat(scene, 220, 9, asphalt, 0, z, 0.0015);
  for (let x = -108; x < 108; x += 9)
    if (Math.abs(x) > 7) flat(scene, 3, 0.14, lineMat, x, z, 0.006);
}
for (const x of [-LANE_W*1.5-0.2, LANE_W*1.5+0.2])                        // solid edges
  flat(scene, 0.14, 300, lineMat, x, 0, 0.005);
for (const x of [-LANE_W/2, LANE_W/2])                                    // dashed lanes
  for (let z = -148; z < 148; z += 9)
    if (Math.abs(z + 40) > 6 && Math.abs(z - 40) > 6)
      flat(scene, 0.14, 3, lineMat, x, z, 0.005);

const CROSSINGS = [-34.8, 8, 45.2];                                       // zebra crossings
for (const z of CROSSINGS)
  for (let x = -4.8; x <= 4.8; x += 1.6)
    flat(scene, 1.0, 2.4, lineMat, x, z, 0.007);

// buildings
const BUILDINGS = [
  [-14,-60,10,14,9,0x8a7f72], [-13,-18,8,10,6,0x707a84], [-15,16,12,12,12,0x9a8f7a],
  [-14,62,9,16,7,0x8c6a5d],  [30,-58,12,12,8,0x707a84], [33,-12,10,18,10,0x8a7f72],
  [31,58,12,10,6,0x9a8f7a]
];
for (const [x,z,w,d,h,c] of BUILDINGS) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));
  b.position.set(x, h/2, z); b.castShadow = true; b.receiveShadow = true; scene.add(b);
}
// trees
const trunkM = mat(0x6b5138), leafM = mat(0x4c6b3c);
function tree(x, z){
  const t = new THREE.Group();
  box(t, 0.3, 1.6, 0.3, trunkM, 0, 0.8, 0);
  const c = new THREE.Mesh(new THREE.ConeGeometry(1.3, 2.8, 8), leafM);
  c.position.y = 2.8; c.castShadow = true; t.add(c);
  t.position.set(x, 0, z); scene.add(t);
}
for (let z = -140; z < 150; z += 13) if (Math.abs(z+40) > 8 && Math.abs(z-40) > 8) tree(-7.4, z + Math.random()*3);
for (let z = -140; z < -26; z += 14) tree(7.2, z);
for (let z = 58; z < 150; z += 14) tree(7.2, z);

// ---------- parking practice ----------
flat(scene, 17, 32, asphalt2, 14.4, 0, 0.002);                            // car park slab
for (let i = 0; i <= 6; i++) flat(scene, 5, 0.12, lineMat, 19.5, -12 + i*3, 0.008);  // bay lines

function propCar(x, z, rotY, color){
  const g = new THREE.Group();
  box(g, 1.75, 0.7, 4.2, mat(color), 0, 0.6, 0);
  box(g, 1.55, 0.45, 2.0, mat(0x1e2126), 0, 1.15, 0.15);
  for (const [wx,wz] of [[0.8,-1.4],[-0.8,-1.4],[0.8,1.4],[-0.8,1.4]]) {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.24,14), mat(0x1c1e21));
    w.rotation.z = Math.PI/2; w.position.set(wx, 0.32, wz); w.castShadow = true; g.add(w);
  }
  g.position.set(x, 0, z); g.rotation.y = rotY; scene.add(g); return g;
}
propCar(19.5, -10.5, -Math.PI/2, 0x7a4a3f);                               // bay neighbours
propCar(19.5,  -4.5, -Math.PI/2, 0x5d6b58);
propCar(19.5,   1.5, -Math.PI/2, 0x4a5a72);
propCar(4.45, 15.8, 0, 0x6b6f76);                                          // kerbside neighbours
propCar(4.45, 26.6, 0, 0x74584a);

const outlineM = new THREE.MeshBasicMaterial({ color:0xffb000 });
function bayOutline(cx, cz, w, l){
  const g = new THREE.Group();
  box(g, w, 0.02, 0.1, outlineM, 0, 0.012, -l/2);
  box(g, w, 0.02, 0.1, outlineM, 0, 0.012,  l/2);
  box(g, 0.1, 0.02, l, outlineM, -w/2, 0.012, 0);
  box(g, 0.1, 0.02, l, outlineM,  w/2, 0.012, 0);
  g.position.set(cx, 0, cz); scene.add(g); return g;
}
const TARGETS = [
  { x:19.5, z:-7.5, axis:'x', name:'90\u00B0 bay' },
  { x:4.45, z:21.2, axis:'z', name:'parallel spot' }
];
bayOutline(19.5, -7.5, 5, 2.85);
bayOutline(4.45, 21.2, 2.3, 6.2);

// ---------- pedestrians ----------
const peds = [];
const pedColors = [0x9c4f4f, 0x4f6d9c, 0x7a9c4f, 0x9c8a4f, 0x6f4f9c];
function makePed(color, crossZ, x0, dir){
  const g = new THREE.Group();
  box(g, 0.16, 0.45, 0.16, mat(0x33363c),  0.09, 0.225, 0);
  box(g, 0.16, 0.45, 0.16, mat(0x33363c), -0.09, 0.225, 0);
  box(g, 0.36, 0.55, 0.22, mat(color), 0, 0.73, 0);
  const h = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 10), mat(0xd8b49a));
  h.position.y = 1.16; h.castShadow = true; g.add(h);
  scene.add(g);
  peds.push({ g, z:crossZ + (Math.random()-0.5)*1.2, x:x0, dir, wait:Math.random()*2, t:Math.random()*6 });
}
makePed(pedColors[0], CROSSINGS[0], -6.8,  1);
makePed(pedColors[1], CROSSINGS[0],  6.8, -1);
makePed(pedColors[2], CROSSINGS[1], -6.8,  1);
makePed(pedColors[3], CROSSINGS[2],  6.8, -1);
makePed(pedColors[4], CROSSINGS[2], -2.0,  1);

// ---------- the car (right-hand drive) ----------
const car = new THREE.Group(); scene.add(car);
const paint = mat(0x3a6b9c), dark = mat(0x1c1e21), trim = mat(0x24262a);
const glassM = new THREE.MeshLambertMaterial({ color:0x9fc6d8, transparent:true, opacity:0.13, side:THREE.DoubleSide, depthWrite:false });

box(car, 1.8, 0.75, 4.4, paint, 0, 0.625, 0);
box(car, 1.6, 0.08, 1.85, paint, 0, 1.46, 0.375);
const wsTilt = -Math.atan2(0.42, 0.55);
box(car, 1.64, 0.03, 0.70, glassM, 0, 1.21, -0.825, wsTilt);
box(car, 0.09, 0.06, 0.72, trim,  0.86, 1.21, -0.825, wsTilt);
box(car, 0.09, 0.06, 0.72, trim, -0.86, 1.21, -0.825, wsTilt);
box(car, 0.07, 0.44, 0.13, trim,  0.88, 1.21, 0.35);
box(car, 0.07, 0.44, 0.13, trim, -0.88, 1.21, 0.35);
const rgTilt = Math.atan2(0.42, 0.45);
box(car, 1.60, 0.03, 0.62, glassM, 0, 1.21, 1.525, rgTilt);
box(car, 0.14, 0.06, 0.65, trim,  0.84, 1.21, 1.525, rgTilt);
box(car, 0.14, 0.06, 0.65, trim, -0.84, 1.21, 1.525, rgTilt);
for (const s of [1,-1]) {
  const g1 = new THREE.Mesh(new THREE.PlaneGeometry(1.30, 0.42), glassM);
  g1.rotation.y = Math.PI/2; g1.position.set(s*0.885, 1.21, -0.30); car.add(g1);
  const g2 = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 0.42), glassM);
  g2.rotation.y = Math.PI/2; g2.position.set(s*0.885, 1.21, 0.825); car.add(g2);
}
// wheels: steerable front, spinning all
const wheels = [];
function wheelAssembly(x, z, steerable){
  const g = new THREE.Group(); g.position.set(x, 0.32, z);
  const spin = new THREE.Group(); g.add(spin);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.24, 18), dark);
  m.rotation.z = Math.PI/2; m.castShadow = true; spin.add(m);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.26, 10), mat(0x8b8f96));
  hub.rotation.z = Math.PI/2; spin.add(hub);
  car.add(g); wheels.push({ g, spin, steerable });
}
wheelAssembly( 0.82, -1.45, true);  wheelAssembly(-0.82, -1.45, true);
wheelAssembly( 0.82,  1.45, false); wheelAssembly(-0.82,  1.45, false);
// interior
box(car, 1.66, 0.22, 0.50, trim, 0, 0.96, -0.95);
for (const s of [1,-1]) {
  box(car, 0.52, 0.14, 0.55, trim, s*0.42, 0.62, -0.05);
  box(car, 0.52, 0.55, 0.14, trim, s*0.42, 0.90, 0.28);
}
box(car, 0.30, 0.16, 0.12, trim, -0.42, 1.22, 0.28);
// steering wheel with visible spokes; swSpin.rotation.z shows real steering tilt
const swGroup = new THREE.Group();
swGroup.position.set(0.42, 1.02, -0.68);
swGroup.rotation.x = -1.25;
car.add(swGroup);
const swSpin = new THREE.Group(); swGroup.add(swSpin);
const rim = new THREE.Mesh(new THREE.TorusGeometry(0.185, 0.022, 10, 28), dark);
swSpin.add(rim);
box(swSpin, 0.34, 0.035, 0.02, dark, 0, 0, 0);
box(swSpin, 0.035, 0.17, 0.02, dark, 0, -0.095, 0);
const hub2 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.04, 12), trim);
hub2.rotation.x = Math.PI/2; swSpin.add(hub2);

// ---------- mirrors (children of car, so they drive with it) ----------
const mirrorRigs = [];
function makeMirror(cfg, housingSide){
  const rt = new THREE.WebGLRenderTarget(Math.round(240*cfg.aspect), 240);
  rt.texture.wrapS = THREE.RepeatWrapping;
  rt.texture.repeat.x = -1; rt.texture.offset.x = 1;
  const cam = new THREE.PerspectiveCamera(cfg.fov, cfg.aspect, 0.3, 90);
  cam.position.copy(cfg.pos);
  cam.lookAt(cfg.pos.clone().add(cfg.dir));   // car is at origin during init, so local == world
  car.add(cam);
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(cfg.size[0], cfg.size[1]),
    new THREE.MeshBasicMaterial({ map: rt.texture }));
  plane.position.copy(cfg.pos);
  plane.lookAt(EYE);
  car.add(plane);
  const back = new THREE.Mesh(new THREE.BoxGeometry(cfg.size[0]+0.035, cfg.size[1]+0.035, 0.02), trim);
  back.position.z = -0.014;
  plane.add(back);
  if (housingSide) box(car, 0.16, 0.04, 0.05, trim, cfg.pos.x - housingSide*0.09, cfg.pos.y - 0.06, cfg.pos.z);
  else box(car, 0.03, 0.10, 0.03, trim, cfg.pos.x, cfg.pos.y + 0.09, cfg.pos.z - 0.03);
  mirrorRigs.push({ cam, rt, plane });
}
makeMirror(MIRRORS.right,  1);
makeMirror(MIRRORS.left,  -1);
makeMirror(MIRRORS.rear,   0);

// ---------- motorcycle (paces the car in an adjacent lane) ----------
const bike = new THREE.Group(); scene.add(bike);
const bikeBody = mat(0xb8342e), rider = mat(0x2a2d33), hiVis = mat(0xffb000);
for (const z of [-0.7, 0.72]) {
  const w = new THREE.Mesh(new THREE.CylinderGeometry(0.31, 0.31, 0.12, 16), dark);
  w.rotation.z = Math.PI/2; w.position.set(0, 0.31, z); w.castShadow = true; bike.add(w);
  bike['wheel' + (z < 0 ? 'F' : 'R')] = w;
}
box(bike, 0.24, 0.34, 1.25, bikeBody, 0, 0.62, 0.05);
box(bike, 0.42, 0.05, 0.08, trim, 0, 0.95, -0.55);
box(bike, 0.32, 0.52, 0.28, rider, 0, 1.08, 0.12, 0.18);
box(bike, 0.13, 0.34, 0.13, rider,  0.16, 0.65, 0.10);
box(bike, 0.13, 0.34, 0.13, rider, -0.16, 0.65, 0.10);
const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.15, 14, 12), hiVis);
helmet.position.set(0, 1.44, -0.02); helmet.castShadow = true; bike.add(helmet);
const headlight = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8),
  new THREE.MeshBasicMaterial({ color:0xfff6d0 }));
headlight.position.set(0, 0.72, -0.66); bike.add(headlight);

// ---------- overlay zones (children of car) ----------
function wedgeMesh(points2D, color, opacity){
  const shape = new THREE.Shape(points2D.map(p => new THREE.Vector2(p[0], p[1])));
  const geo = new THREE.ShapeGeometry(shape);
  geo.rotateX(Math.PI/2);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    color, transparent:true, opacity, side:THREE.DoubleSide, depthWrite:false }));
  m.position.y = 0.035;
  car.add(m); return m;
}
const blindZones = [], coverZones = [];
(function buildZones(){
  const perRad = (180 - PERIPHERAL_DEG) * Math.PI/180;
  for (const side of [1, -1]) {
    const cfg = side === 1 ? MIRRORS.right : MIRRORS.left;
    const yawC = Math.atan2(Math.abs(cfg.dir.x), cfg.dir.z);
    const half = Math.atan(Math.tan(cfg.fov*Math.PI/360) * cfg.aspect);
    const outer = yawC + half, inner = yawC - half;
    const mp = { x:cfg.pos.x, z:cfg.pos.z }, ep = { x:EYE.x, z:EYE.z };
    const mDir = { x:side*Math.sin(outer), z:Math.cos(outer) };
    const pDir = { x:side*Math.sin(perRad), z:Math.cos(perRad) };
    const denom = mDir.x*pDir.z - mDir.z*pDir.x;
    const t = ((ep.x-mp.x)*pDir.z - (ep.z-mp.z)*pDir.x) / denom;
    const ax = mp.x + mDir.x*t, az = mp.z + mDir.z*t;
    const xEnd = side * 6.8;
    const zOnP = ep.z + pDir.z * (xEnd-ep.x)/pDir.x;
    const zOnM = mp.z + mDir.z * (xEnd-mp.x)/mDir.x;
    blindZones.push(wedgeMesh([[ax,az],[xEnd,zOnP],[xEnd,Math.min(zOnM,13)]], 0xe5484d, 0.30));
    const L = 20;
    coverZones.push(wedgeMesh([
      [mp.x, mp.z],
      [mp.x + side*Math.sin(inner)*L, mp.z + Math.cos(inner)*L],
      [mp.x + side*Math.sin(outer)*L, mp.z + Math.cos(outer)*L]
    ], 0x46a758, 0.14));
  }
  const rc = MIRRORS.rear;
  const rHalf = Math.atan(Math.tan(rc.fov*Math.PI/360) * rc.aspect), L = 24;
  coverZones.push(wedgeMesh([
    [rc.pos.x, rc.pos.z],
    [rc.pos.x - Math.sin(rHalf)*L, rc.pos.z + Math.cos(rHalf)*L],
    [rc.pos.x + Math.sin(rHalf)*L, rc.pos.z + Math.cos(rHalf)*L]
  ], 0x46a758, 0.14));
})();
coverZones.forEach(z => z.visible = false);

// ---------- cameras ----------
const povCam = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.05, 250);
povCam.position.copy(EYE);
povCam.rotation.order = 'YXZ';
car.add(povCam);
const orbitCam = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 500);

// ---------- state / input ----------
const state = {
  mode:'pov', yaw:0, pitch:0,
  theta:0.9, phi:1.0, radius:14,
  bikeZ:2.4, laneSide:1, riding:false, bikeOn:true,
  heading:0, speed:0, steer:0, gear:1
};
const input = { gas:0, brake:0, left:0, right:0 };

const cvs = renderer.domElement;
let dragging = false, px = 0, py = 0;
cvs.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; cvs.setPointerCapture(e.pointerId); });
cvs.addEventListener('pointerup',   () => dragging = false);
cvs.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY;
  if (state.mode === 'pov') {
    state.yaw   = THREE.MathUtils.clamp(state.yaw   - dx*0.0042, -2.9, 2.9);
    state.pitch = THREE.MathUtils.clamp(state.pitch - dy*0.0042, -1.2, 1.2);
  } else {
    state.theta -= dx*0.005;
    state.phi = THREE.MathUtils.clamp(state.phi - dy*0.005, 0.15, 1.45);
  }
});
cvs.addEventListener('dblclick', () => { state.yaw = 0; state.pitch = 0; });
cvs.addEventListener('wheel', e => {
  if (state.mode === 'orbit')
    state.radius = THREE.MathUtils.clamp(state.radius + e.deltaY*0.012, 5, 40);
}, { passive:true });

const KEYS = {
  w:'gas', arrowup:'gas', s:'brake', arrowdown:'brake',
  a:'left', arrowleft:'left', d:'right', arrowright:'right'
};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (KEYS[k]) { input[KEYS[k]] = 1; e.preventDefault(); }
  if (k === 'g' || k === 'r') toggleGear();
  if (k === '1') setMode('pov');
  if (k === '2') setMode('orbit');
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (KEYS[k]) input[KEYS[k]] = 0;
});
function hold(id, prop){
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); input[prop] = 1; el.classList.add('held'); };
  const off = () => { input[prop] = 0; el.classList.remove('held'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('pointercancel', off);
}
hold('btnGas','gas'); hold('btnBrake','brake'); hold('btnL','left'); hold('btnR','right');

function toggleGear(){
  if (state.speed > 0.6) return;                       // stop before shifting
  state.gear *= -1;
  const b = document.getElementById('btnGear');
  b.textContent = state.gear > 0 ? 'D' : 'R';
  b.classList.toggle('rev', state.gear < 0);
  document.getElementById('gearVal').textContent = state.gear > 0 ? 'D' : 'R';
}
document.getElementById('btnGear').addEventListener('pointerdown', e => { e.preventDefault(); toggleGear(); });

// ---------- UI ----------
const $ = id => document.getElementById(id);
function setMode(m){
  state.mode = m;
  $('btnPov').classList.toggle('on', m === 'pov');
  $('btnOrbit').classList.toggle('on', m === 'orbit');
}
$('btnPov').onclick = () => setMode('pov');
$('btnOrbit').onclick = () => setMode('orbit');
$('chkBlind').onchange = e => blindZones.forEach(z => z.visible = e.target.checked);
$('chkCover').onchange = e => coverZones.forEach(z => z.visible = e.target.checked);
$('chkBike').onchange = e => { state.bikeOn = e.target.checked; bike.visible = state.bikeOn; };
$('bikeSlider').oninput = e => { state.bikeZ = parseFloat(e.target.value); state.riding = false; $('btnRide').classList.remove('on'); };
$('btnRide').onclick = () => {
  state.riding = !state.riding;
  $('btnRide').classList.toggle('on', state.riding);
  if (state.riding && state.bikeZ < -13) state.bikeZ = 22;
};
$('btnLane').onclick = () => {
  state.laneSide *= -1;
  $('btnLane').textContent = 'Lane: ' + (state.laneSide === 1 ? 'right' : 'left');
};

// ---------- banner / toasts ----------
let toastText = null, toastCls = 'ok', toastTimer = 0;
function toast(text, cls, secs){ toastText = text; toastCls = cls; toastTimer = secs; }
function setBanner(cls, main, why){
  $('banner').style.display = '';
  $('signBox').className = 'sign ' + cls;
  $('signBox').textContent = main;
  $('whyBox').textContent = why || '';
  $('whyBox').style.display = why ? '' : 'none';
}

// ---------- visibility check ----------
const occluders = car.children.filter(o => o.isMesh && o.material && o.material !== glassM && !o.material.map);
const ray = new THREE.Raycaster();
const camFwd = new THREE.Vector3(), toP = new THREE.Vector3(), ndc = new THREE.Vector3(),
      sp = new THREE.Vector3(), camW = new THREE.Vector3(), lb = new THREE.Vector3();
const SAMPLES = [[0,1.44,0],[0,0.72,-0.66],[0,0.85,0.05],[0,0.4,0.72],[0,0.4,-0.7]];
function pointSeenBy(cam, p){
  cam.getWorldDirection(camFwd);
  cam.getWorldPosition(camW);
  toP.copy(p).sub(camW);
  const dist = toP.length();
  if (camFwd.dot(toP) / dist < 0.2) return false;
  ndc.copy(p).project(cam);
  if (Math.abs(ndc.x) > 0.9 || Math.abs(ndc.y) > 0.95) return false;
  ray.set(camW, toP.normalize());
  ray.far = dist - 0.3;
  return ray.intersectObjects(occluders).length === 0;
}
function bikeStatus(){
  let inMirror = false;
  for (const rig of mirrorRigs) {
    for (const s of SAMPLES) {
      // sample points in bike-local space rotated by heading
      sp.set(s[0], s[1], s[2]).applyAxisAngle(new THREE.Vector3(0,1,0), state.heading).add(bike.position);
      sp.y = s[1];
      if (pointSeenBy(rig.cam, sp)) { inMirror = true; break; }
    }
    if (inMirror) break;
  }
  lb.copy(bike.position); car.worldToLocal(lb);
  const v = lb.sub(EYE);
  const angle = Math.atan2(Math.abs(v.x), -v.z) * 180/Math.PI;
  const direct = angle < PERIPHERAL_DEG && -v.z > -25;
  if (!inMirror && !direct)
    setBanner('bad', 'Hidden in blind spot',
      state.mode === 'pov' ? 'Not in any mirror \u2014 drag to head check over your shoulder'
                           : 'Outside every mirror and behind peripheral vision');
  else
    setBanner('ok', inMirror ? 'Visible in mirror' : 'Visible ahead / peripheral',
      inMirror ? 'The rider appears in at least one mirror' : 'Within the driver\u2019s forward field of view');
}

// ---------- parking check ----------
const parkedLatch = [false, false];
function checkParking(){
  TARGETS.forEach((t, i) => {
    const dx = car.position.x - t.x, dz = car.position.z - t.z;
    const along  = t.axis === 'x' ? dx : dz;
    const across = t.axis === 'x' ? dz : dx;
    const aligned = t.axis === 'x' ? Math.abs(Math.sin(state.heading)) > 0.94
                                   : Math.abs(Math.cos(state.heading)) > 0.94;
    const inside = Math.abs(along) < 1.1 && Math.abs(across) < 0.75 && aligned;
    if (inside && state.speed < 0.25 && !parkedLatch[i]) {
      parkedLatch[i] = true;
      toast('Nicely parked \u2014 ' + t.name + ' \u2713', 'ok', 3);
    }
    if (!inside) parkedLatch[i] = false;
  });
}

// ---------- resize ----------
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  povCam.aspect = orbitCam.aspect = window.innerWidth/window.innerHeight;
  povCam.updateProjectionMatrix(); orbitCam.updateProjectionMatrix();
});

// ---------- main loop ----------
const clock = new THREE.Clock();
const fwd = new THREE.Vector3();
let pedCooldown = 0;

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);

  // --- driving physics ---
  const steerTarget = (input.left - input.right) * 0.5;   // + = left
  const rate = 2.2 * dt;
  state.steer += THREE.MathUtils.clamp(steerTarget - state.steer, -rate, rate);
  if (input.gas)  state.speed += (state.gear > 0 ? 4.0 : 2.6) * dt;
  if (input.brake) state.speed -= 8.0 * dt;
  state.speed -= state.speed * 0.35 * dt;                 // drag
  if (!input.gas) state.speed -= 0.4 * dt;                // rolling resistance
  state.speed = THREE.MathUtils.clamp(state.speed, 0, state.gear > 0 ? 13.5 : 4);
  const v = state.speed * state.gear;
  state.heading += (v / WHEELBASE) * Math.tan(state.steer) * dt;
  fwd.set(-Math.sin(state.heading), 0, -Math.cos(state.heading));
  car.position.addScaledVector(fwd, v * dt);
  car.position.x = THREE.MathUtils.clamp(car.position.x, -100, 100);
  car.position.z = THREE.MathUtils.clamp(car.position.z, -145, 145);
  car.rotation.y = state.heading;
  car.updateMatrixWorld(true);

  // wheel + steering-wheel visuals
  const spin = (v / 0.32) * dt;
  for (const w of wheels) {
    if (w.steerable) w.g.rotation.y = state.steer;
    w.spin.rotation.x -= spin;
  }
  swSpin.rotation.z = state.steer * 6;                    // ~real steering ratio

  // sun follows the car so shadows never fall off the map
  sun.position.set(car.position.x + 28, 42, car.position.z + 18);
  sun.target.position.copy(car.position);

  // --- motorcycle pacing the car ---
  if (state.bikeOn) {
    if (state.riding) {
      state.bikeZ -= dt * 4.5;
      if (state.bikeZ < -14) state.bikeZ = 22;
      $('bikeSlider').value = state.bikeZ;
      const bs = dt * 4.5 / 0.31;
      bike.wheelF.rotation.x -= bs; bike.wheelR.rotation.x -= bs;
    }
    lb.set(state.laneSide * LANE_W, 0, state.bikeZ);
    car.localToWorld(lb);
    bike.position.set(lb.x, 0, lb.z);
    bike.rotation.y = state.heading;
  }

  // --- pedestrians ---
  pedCooldown -= dt;
  for (const p of peds) {
    p.t += dt;
    if (p.wait > 0) p.wait -= dt;
    else {
      p.x += p.dir * 1.25 * dt;
      if (Math.abs(p.x) > 6.8) { p.dir *= -1; p.wait = 1.5 + Math.random()*2.5; }
    }
    p.g.position.set(p.x, p.wait > 0 ? 0 : Math.abs(Math.sin(p.t*7))*0.04, p.z);
    p.g.rotation.y = p.dir > 0 ? -Math.PI/2 : Math.PI/2;
    const d = Math.hypot(car.position.x - p.x, car.position.z - p.z);
    if (d < 1.5 && state.speed > 0.2) {
      state.speed = 0;
      toast('You hit a pedestrian!', 'bad', 2.5);
    } else if (d < 4.5 && state.speed > 2.5 && pedCooldown <= 0 && toastTimer <= 0) {
      toast('Pedestrian on the crossing \u2014 slow down', 'bad', 1.5);
      pedCooldown = 3;
    }
  }

  checkParking();

  // --- banner priority: toast > motorcycle status > hidden ---
  if (toastTimer > 0) { toastTimer -= dt; setBanner(toastCls, toastText, ''); }
  else if (state.bikeOn) bikeStatus();
  else $('banner').style.display = 'none';

  $('spdVal').textContent = Math.round(state.speed * 3.6);

  // --- render mirrors ---
  const hiddenObjs = [...blindZones, ...coverZones, ...mirrorRigs.map(r => r.plane)];
  const prev = hiddenObjs.map(o => o.visible);
  hiddenObjs.forEach(o => o.visible = false);
  for (const rig of mirrorRigs) {
    renderer.setRenderTarget(rig.rt);
    renderer.render(scene, rig.cam);
  }
  renderer.setRenderTarget(null);
  hiddenObjs.forEach((o, i) => o.visible = prev[i]);

  // --- render main view ---
  if (state.mode === 'pov') {
    povCam.rotation.set(state.pitch, state.yaw, 0);
    renderer.render(scene, povCam);
  } else {
    orbitCam.position.set(
      car.position.x + Math.sin(state.theta) * Math.sin(state.phi) * state.radius,
      Math.cos(state.phi) * state.radius + 1,
      car.position.z + Math.cos(state.theta) * Math.sin(state.phi) * state.radius
    );
    orbitCam.lookAt(car.position.x, 0.7, car.position.z);
    renderer.render(scene, orbitCam);
  }
}
tick();
})();
</script>
</body>
</html>
